<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IGCSE Business 0264 - Complete Revision Guide</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --panel: #ffffff;
      --panel-soft: #eef4ff;
      --primary: #1d4ed8;
      --primary-dark: #172554;
      --primary-light: #dfeafc;
      --secondary: #2f59d9;
      --accent: #0f766e;
      --text: #1d2433;
      --muted: #5b6475;
      --border: #dde5f0;
      --success: #16a34a;
      --warning: #f59e0b;
      --danger: #dc2626;
      --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
      --sidebar-width: 300px;
      --header-height: 86px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }
    img { max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: var(--header-height);
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: white;
      box-shadow: 0 10px 22px rgba(23, 37, 84, 0.18);
    }

    .topbar-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 100%;
      padding: 0 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.14);
      font-size: 1.5rem;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
    }

    .brand-text {
      min-width: 0;
    }

    .brand-text h1 {
      margin: 0;
      font-size: clamp(1.1rem, 1.8vw, 1.7rem);
      white-space: nowrap;
      line-height: 1.2;
    }

    .brand-text p {
      margin: 0;
      color: rgba(255,255,255,0.82);
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .menu-button {
      display: none;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
      color: white;
      border: 1px solid rgba(255,255,255,0.18);
      cursor: pointer;
      font-size: 1.3rem;
    }

    .layout {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      align-items: flex-start;
      min-height: calc(100vh - var(--header-height));
    }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--panel);
      border-right: 1px solid var(--border);
      position: sticky;
      top: var(--header-height);
      height: calc(100vh - var(--header-height));
      overflow-y: auto;
      transition: transform 0.25s ease;
      box-shadow: 8px 0 16px rgba(15, 23, 42, 0.04);
    }

    .sidebar-header {
      padding: 18px 18px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel-soft);
      color: var(--primary-dark);
      font-weight: 700;
    }

    .nav-block {
      border-bottom: 1px solid var(--border);
    }

    .nav-item {
      width: 100%;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 13px 18px;
      color: var(--text);
      cursor: pointer;
      transition: 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.92rem;
    }

    .nav-item:hover,
    .nav-item.active {
      background: var(--primary-light);
      color: var(--primary-dark);
      font-weight: 700;
    }

    .nav-item.special {
      background: white;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .nav-section {
      border-bottom: 1px solid var(--border);
    }

    .nav-section-header .nav-item {
      background: #f8faff;
      font-weight: 700;
      color: var(--primary-dark);
      font-size: 0.86rem;
    }

    .nav-chapters {
      display: none;
      background: white;
    }

    .nav-section.open .nav-chapters {
      display: block;
    }

    .nav-chapters .nav-item {
      padding-left: 34px;
      font-size: 0.87rem;
    }

    .main {
      flex: 1;
      min-width: 0;
      padding: 26px 28px 40px;
    }

    .content-wrap {
      max-width: 1200px;
      margin: 0 auto;
    }

    .hero {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: white;
      border-radius: 18px;
      padding: 42px 30px;
      box-shadow: var(--shadow);
      margin-bottom: 26px;
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 3vw, 3.2rem);
      line-height: 1.15;
    }

    .hero p {
      margin: 0;
      max-width: 720px;
      font-size: 1.04rem;
      color: rgba(255,255,255,0.9);
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin: 30px 0;
    }

    .feature {
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 18px;
      box-shadow: var(--shadow);
    }

    .feature .icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .feature h3 {
      margin: 0 0 8px;
      color: var(--primary-dark);
      font-size: 1.05rem;
    }

    .feature p {
      margin: 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .card h2,
    .card h3,
    .card h4 {
      margin-top: 0;
      color: var(--primary-dark);
    }

    .card h2 {
      font-size: clamp(1.5rem, 2vw, 2.1rem);
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--panel-soft);
    }

    .card h3 {
      font-size: 1.2rem;
      margin: 20px 0 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 12px 14px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: var(--primary-dark);
      color: white;
      font-weight: 600;
    }

    tr:nth-child(even) td {
      background: #fafcff;
    }

    ul, ol {
      margin-top: 8px;
      padding-left: 22px;
    }

    li { margin: 6px 0; }

    .tip-box,
    .warning-box,
    .info-box {
      border-left: 5px solid;
      border-radius: 10px;
      padding: 14px 16px;
      margin: 16px 0;
      font-size: 0.95rem;
    }

    .tip-box {
      background: #edf6ff;
      border-left-color: #2196f3;
      color: #0a4a7a;
    }

    .warning-box {
      background: #fff7ed;
      border-left-color: var(--warning);
      color: #8a4a00;
    }

    .info-box {
      background: #ebfaf2;
      border-left-color: var(--success);
      color: #166534;
    }

    .formula-box {
      background: linear-gradient(135deg, var(--primary-dark), var(--primary));
      color: white;
      border-radius: 12px;
      padding: 16px 18px;
      margin: 14px 0;
      font-family: "Courier New", monospace;
      line-height: 1.7;
      font-weight: 700;
    }

    .vocab-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 18px;
      margin-top: 18px;
    }

    .vocab-card {
      background: #f8faff;
      border: 1px solid var(--border);
      border-radius: 12px;
      border-left: 5px solid var(--primary);
      padding: 16px;
    }

    .vocab-card .term {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }

    .vocab-card .definition {
      margin-bottom: 8px;
    }

    .vocab-card .example {
      border-top: 1px dashed var(--border);
      padding-top: 8px;
      color: var(--muted);
      font-style: italic;
      font-size: 0.9rem;
    }

    .mcq-block {
      margin-top: 18px;
    }

    .mcq-question {
      background: #f8faff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 18px 12px;
      margin-bottom: 16px;
    }

    .mcq-question p {
      margin: 0 0 12px;
      font-weight: 600;
    }

    .mcq-option {
      display: flex;
      align-items: center;
      gap: 10px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin: 8px 0;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mcq-option:hover {
      border-color: var(--primary);
      background: #f5f9ff;
    }

    .mcq-option input[type="radio"] {
      accent-color: var(--primary);
      width: 16px;
      height: 16px;
    }

    .mcq-option.selected {
      border-color: var(--primary);
      background: #edf4ff;
    }

    .mcq-option.correct {
      background: #ebfaf2;
      border-color: var(--success);
    }

    .mcq-option.incorrect {
      background: #fff1f2;
      border-color: var(--danger);
    }

    .mcq-feedback {
      display: none;
      padding: 12px 14px;
      margin-top: 10px;
      border-radius: 10px;
      font-weight: 600;
    }

    .mcq-feedback.show {
      display: block;
    }

    .mcq-feedback.correct {
      background: #ebfaf2;
      border-left: 4px solid var(--success);
      color: #166534;
    }

    .mcq-feedback.incorrect {
      background: #fff1f2;
      border-left: 4px solid var(--danger);
      color: #991b1b;
    }

    .answer-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      background: var(--primary);
      color: white;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.15s ease;
      box-shadow: 0 10px 20px rgba(29, 78, 216, 0.18);
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn.secondary {
      background: white;
      border: 1px solid var(--border);
      color: var(--primary-dark);
      box-shadow: none;
    }

    .score-box {
      background: #edf6ff;
      border: 1px solid #d4eaff;
      color: var(--primary-dark);
      border-radius: 10px;
      padding: 12px 14px;
      font-weight: 700;
    }

    .exam-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      background: white;
      margin-bottom: 18px;
    }

    .exam-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .badge {
      display: inline-block;
      background: var(--primary-light);
      color: var(--primary-dark);
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .badge.orange {
      background: #fff2d6;
      color: #8c5b00;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      background: white;
      color: var(--text);
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
    }

    .model-answer {
      display: none;
      background: #ebfaf2;
      border: 1px solid #cfeee0;
      border-radius: 10px;
      padding: 14px 16px;
      margin-top: 14px;
      color: #14532d;
    }

    .model-answer.show {
      display: block;
    }

    .placeholder {
      background: #f8fafc;
      border: 1px dashed var(--border);
      color: var(--muted);
      border-radius: 12px;
      padding: 22px;
      text-align: center;
    }

    .study-notes h4 {
      margin: 22px 0 8px;
      color: var(--primary-dark);
    }

    .study-notes h4:first-child {
      margin-top: 0;
    }

    .study-notes ul {
      margin-top: 6px;
    }

    .study-note-intro {
      margin-top: 0;
    }

    @media (max-width: 980px) {
      .menu-button { display: inline-flex; align-items: center; justify-content: center; }
      .layout { display: block; }
      .sidebar {
        position: fixed;
        left: 0;
        top: var(--header-height);
        z-index: 40;
        transform: translateX(-110%);
      }
      .sidebar.open { transform: translateX(0); }
      .main { padding: 22px 16px 32px; }
    }

    @media (max-width: 640px) {
      .topbar-inner { padding: 0 14px; }
      .brand-text p { display: none; }
      .card { padding: 18px 16px; }
      .hero { padding: 30px 20px; }
      .answer-actions { flex-direction: column; align-items: stretch; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">📚</div>
        <div class="brand-text">
          <h1>IGCSE Business Studies 0264</h1>
          <p>Complete Revision Guide</p>
        </div>
      </div>
      <button class="menu-button" onclick="toggleSidebar()" aria-label="Toggle sidebar">☰</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">Course Navigation</div>

      <div class="nav-block">
        <button class="nav-item special" onclick="showSection('home', this)">🏠 Home</button>
        <button class="nav-item special" onclick="showSection('exam-skills', this)">🎯 Exam Skills</button>
        <button class="nav-item special" onclick="showSection('formulas', this)">📐 Formulas</button>
      </div>

      <div class="nav-section open">
        <div class="nav-section-header">
          <button class="nav-item" onclick="toggleSection(this.parentElement.parentElement)">Section 1: Understanding Business Activity <span>▾</span></button>
        </div>
        <div class="nav-chapters">
          <button class="nav-item" onclick="showChapter(1, this)">Ch 1: Business Activity and Economic Sectors</button>
          <button class="nav-item" onclick="showChapter(2, this)">Ch 2: Enterprise, Business Growth and Size</button>
          <button class="nav-item" onclick="showChapter(3, this)">Ch 3: Types of Business Organisations</button>
          <button class="nav-item" onclick="showChapter(4, this)">Ch 4: Business Objectives and Stakeholder Objectives</button>
        </div>
      </div>

      <div class="nav-section open">
        <div class="nav-section-header">
          <button class="nav-item" onclick="toggleSection(this.parentElement.parentElement)">Section 2: People in Business <span>▾</span></button>
        </div>
        <div class="nav-chapters">
          <button class="nav-item" onclick="showChapter(5, this)">Ch 5: Human Resource Management</button>
          <button class="nav-item" onclick="showChapter(6, this)">Ch 6: Organisation and Management</button>
          <button class="nav-item" onclick="showChapter(7, this)">Ch 7: Methods of Communication</button>
          <button class="nav-item" onclick="showChapter(8, this)">Ch 8: Motivating Employees</button>
        </div>
      </div>

      <div class="nav-section open">
        <div class="nav-section-header">
          <button class="nav-item" onclick="toggleSection(this.parentElement.parentElement)">Section 3: Marketing <span>▾</span></button>
        </div>
        <div class="nav-chapters">
          <button class="nav-item" onclick="showChapter(9, this)">Ch 9: Marketing and the Market</button>
          <button class="nav-item" onclick="showChapter(10, this)">Ch 10: Market Research</button>
          <button class="nav-item" onclick="showChapter(11, this)">Ch 11: The Marketing Mix - Product</button>
          <button class="nav-item" onclick="showChapter(12, this)">Ch 12: The Marketing Mix - Price</button>
          <button class="nav-item" onclick="showChapter(13, this)">Ch 13: The Marketing Mix - Place</button>
          <button class="nav-item" onclick="showChapter(14, this)">Ch 14: The Marketing Mix - Promotion</button>
          <button class="nav-item" onclick="showChapter(15, this)">Ch 15: E-commerce</button>
          <button class="nav-item" onclick="showChapter(16, this)">Ch 16: Marketing Strategy, Entering New Markets and Legal Controls</button>
        </div>
      </div>

      <div class="nav-section open">
        <div class="nav-section-header">
          <button class="nav-item" onclick="toggleSection(this.parentElement.parentElement)">Section 4: Operations Management <span>▾</span></button>
        </div>
        <div class="nav-chapters">
          <button class="nav-item" onclick="showChapter(17, this)">Ch 17: Production of Goods and Services</button>
          <button class="nav-item" onclick="showChapter(18, this)">Ch 18: Technology and Production</button>
          <button class="nav-item" onclick="showChapter(19, this)">Ch 19: Sustainable Production</button>
          <button class="nav-item" onclick="showChapter(20, this)">Ch 20: Costs, Scale of Production and Break-even</button>
          <button class="nav-item" onclick="showChapter(21, this)">Ch 21: Quality of Goods and Services</button>
          <button class="nav-item" onclick="showChapter(22, this)">Ch 22: Location Decisions</button>
        </div>
      </div>

      <div class="nav-section open">
        <div class="nav-section-header">
          <button class="nav-item" onclick="toggleSection(this.parentElement.parentElement)">Section 5: Financial Information and Decisions <span>▾</span></button>
        </div>
        <div class="nav-chapters">
          <button class="nav-item" onclick="showChapter(23, this)">Ch 23: Business Finance</button>
          <button class="nav-item" onclick="showChapter(24, this)">Ch 24: Cash Flow Forecast</button>
          <button class="nav-item" onclick="showChapter(25, this)">Ch 25: Profit and Loss</button>
          <button class="nav-item" onclick="showChapter(26, this)">Ch 26: Statement of Financial Position</button>
          <button class="nav-item" onclick="showChapter(27, this)">Ch 27: Analysis of Accounts</button>
        </div>
      </div>

      <div class="nav-section open">
        <div class="nav-section-header">
          <button class="nav-item" onclick="toggleSection(this.parentElement.parentElement)">Section 6: External Influences on Business Activity <span>▾</span></button>
        </div>
        <div class="nav-chapters">
          <button class="nav-item" onclick="showChapter(28, this)">Ch 28: Economic Issues</button>
          <button class="nav-item" onclick="showChapter(29, this)">Ch 29: Business and the International Economy</button>
          <button class="nav-item" onclick="showChapter(30, this)">Ch 30: Business and the Environment</button>
          <button class="nav-item" onclick="showChapter(31, this)">Ch 31: Business and Ethical Issues, and Pressure Groups</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="content-wrap" id="main-content"></div>
    </main>
  </div>

  <script>
    const chapters = {};

    function addChapter(num, title, vocabData, notesHtml, mcqData, examData) {
      const vocabHtml = `
        <div class="vocab-grid">
          ${vocabData.map(([term, definition, example]) => `
            <div class="vocab-card">
              <div class="term">${term}</div>
              <div class="definition">${definition}</div>
              <div class="example"><strong>Example:</strong> ${example}</div>
            </div>
          `).join('')}
        </div>
      `;

      const mcqHtml = mcqData.map(([question, options, answer, explanation], idx) => {
        const letters = ['A', 'B', 'C', 'D'];
        return `
          <div class="mcq-question" data-answer="${answer}">
            <p>${idx + 1}. ${question}</p>
            ${options.map((opt, i) => `
              <label class="mcq-option">
                <input type="radio" name="q-${num}-${idx}" value="${letters[i]}">
                <span>${letters[i]}) ${opt}</span>
              </label>
            `).join('')}
            <div class="mcq-feedback"></div>
          </div>
        `;
      }).join('');

      const examHtml = examData.map(([label, command, marks, prompt, modelAnswer]) => `
        <div class="exam-box">
          <div class="exam-header">
            <div class="exam-meta">
              <strong>${label}</strong>
              <span class="badge orange">${command}</span>
              <span class="badge">${marks}</span>
            </div>
          </div>
          <p>${prompt}</p>
          <textarea placeholder="Type your answer here..."></textarea>
          <div class="answer-actions">
            <button class="btn secondary" type="button" onclick="toggleModelAnswer(this)">Show Model Answer</button>
          </div>
          <div class="model-answer">
            <strong>Model Answer:</strong>
            <div>${modelAnswer}</div>
          </div>
        </div>
      `).join('');

      chapters[num] = `
        <div class="card">
          <h2>Chapter ${num}: ${title}</h2>
        </div>

        <div class="card">
          <h3>Key Vocabulary</h3>
          ${vocabHtml}
        </div>

        <div class="card">
          <h3>Textbook Notes</h3>
          ${notesHtml}
        </div>

        <div class="card">
          <h3>Check Your Understanding</h3>
          <div class="mcq-block">${mcqHtml}</div>
          <div class="answer-actions">
            <button class="btn" type="button" onclick="checkMCQAnswers(this)">Check Answers</button>
          </div>
        </div>

        <div class="card">
          <h3>Exam Practice</h3>
          ${examHtml}
        </div>
      `;
    }

    function getHomeContent() {
      return `
        <div class="hero">
          <h1>🎓 IGCSE Business Studies 0264</h1>
          <p>Your complete revision companion for Cambridge IGCSE Business Studies. Master all 6 sections with notes, interactive quizzes, exam practice questions and model answers.</p>
        </div>

        <div class="feature-grid">
          <div class="feature">
            <div class="icon">📚</div>
            <h3>Complete Textbook</h3>
            <p>Detailed notes for all 31 chapters across 6 sections.</p>
          </div>
          <div class="feature">
            <div class="icon">✅</div>
            <h3>Interactive MCQs</h3>

    function checkMCQAnswers(button) {
      const container = button.closest('.card');
      const questions = container.querySelectorAll('.mcq-question');
      let correct = 0;

      questions.forEach((questionEl) => {
        const selected = questionEl.querySelector('input[type="radio"]:checked');
        const correctValue = questionEl.dataset.answer;
        const options = questionEl.querySelectorAll('.mcq-option');
        const feedback = questionEl.querySelector('.mcq-feedback');

        options.forEach(opt => {
          opt.classList.remove('correct', 'incorrect', 'selected');
          const input = opt.querySelector('input');
          if (input && input.checked) opt.classList.add('selected');
        });

        if (!selected) {
          feedback.textContent = 'Please select an answer.';
          feedback.className = 'mcq-feedback show incorrect';
          return;
        }

        const chosen = selected.value;
        const correctOption = questionEl.querySelector(`input[value="${correctValue}"]`).closest('.mcq-option');

        if (chosen === correctValue) {
          selected.closest('.mcq-option').classList.add('correct');
          feedback.textContent = '✓ Correct!';
          feedback.className = 'mcq-feedback show correct';
          correct++;
        } else {
          selected.closest('.mcq-option').classList.add('incorrect');
          correctOption.classList.add('correct');
          feedback.textContent = `✗ Incorrect. The correct answer is ${correctOption.querySelector('span').textContent}.`;
          feedback.className = 'mcq-feedback show incorrect';
        }
      });

      const score = document.createElement('div');
      score.className = 'score-box';
      score.textContent = `You scored ${correct} out of ${questions.length}.`;
      const old = container.querySelector('.score-box');
      if (old) old.remove();
      button.parentElement.appendChild(score);
    }

          ['Controls and implementation', ['Governments may use environmental laws, standards, taxes, permits or incentives. Requirements differ across locations and industries, so businesses must check the rules that apply to them.', 'Set clear targets, assign responsibility, monitor resource use and emissions, and report progress accurately. Environmental claims should be supported by evidence.', 'A practical environmental strategy considers suppliers, operations, distribution, product use and disposal rather than focusing only on visible actions.']]
        ]
      },
      31: {
        vocab: [
          ['Business ethics', 'Principles about right and wrong that guide business conduct.'],
          ['Pressure group', 'An organised group seeking to influence business or government decisions on an issue.'],
          ['Ethical sourcing', 'Choosing suppliers and inputs with consideration for working conditions, rights and wider impacts.'],
          ['Corporate social responsibility', 'A business’s consideration of social and environmental effects alongside financial objectives.']
        ],
        sections: [
          ['Ethical issues in business', ['Ethical questions can involve working conditions, fair pay, discrimination, product safety, honest promotion, animal welfare, environmental impact and responsible supply chains.', 'A business may adopt codes of conduct, supplier standards, audits, staff training and complaint procedures. Policies matter only when they influence actual decisions and are monitored.', 'Ethical decisions can involve trade-offs between cost, speed, profit and stakeholder welfare. Expectations and laws can differ between countries, so businesses should consider both local requirements and their own standards.']],
          ['Benefits and challenges of ethical conduct', ['Responsible conduct can strengthen trust, attract customers and employees, reduce legal or supply-chain risks and support long-term reputation.', 'Ethical sourcing or improved conditions can increase costs, require monitoring and make some suppliers harder to replace. Benefits may take time and may be difficult to measure.', 'Businesses should avoid unsupported claims. Evidence, transparency and corrective action are more credible than a policy statement alone.']],
          ['Pressure groups and influence', ['Pressure groups organise to draw attention to an issue and influence businesses, consumers or governments. They may use campaigns, petitions, research, demonstrations, media coverage or engagement with decision-makers.', 'A campaign can affect reputation, sales, recruitment and investor confidence. Businesses may respond by explaining their position, changing practices, consulting stakeholders or challenging inaccurate claims.', 'Evaluate a pressure group’s influence by considering public support, evidence, media attention, consumer choices and the business’s ability to respond. Different groups can represent conflicting interests.']]
        ]
      }
    };

    function makeChapterDataTemplate(chapterNumber, title, summaryText, sectionLabel) {
      const material = chapterStudyNotes[chapterNumber];
      const mcq = material.vocab.map(([term, definition], index) => {
        const answerIndex = (chapterNumber + index) % material.vocab.length;
        const options = material.vocab
          .filter(([optionTerm]) => optionTerm !== term)
          .map(([optionTerm]) => optionTerm);
        options.splice(answerIndex, 0, term);

        return [
          `Which term matches this definition: ${definition}`,
          options,
          String.fromCharCode(65 + answerIndex),
          `${term}: ${definition}`
        ];
      });

      const notesHtml = `
        <div class="study-notes">
          <div class="info-box study-note-intro">Study notes summarised and paraphrased from the uploaded teaching materials. Use the key ideas with business context in your exam answers.</div>
          ${material.sections.map(([heading, points]) => `
            <h4>${heading}</h4>
            <ul>${points.map(point => `<li>${point}</li>`).join('')}</ul>
          `).join('')}
        </div>
      `;

      return {
        title,
        vocab: material.vocab.map(([term, definition]) => [term, definition, `Apply ${term.toLowerCase()} to the business in the question.`]),
        notes: notesHtml,
        mcq,
        exam: [
          ['1(a)', 'Define', '2 marks', `Define "${material.vocab[0][0]}".`, material.vocab[0][1]],
          ['1(b)', 'Explain', '4 marks', `Explain one reason why ${title.toLowerCase()} is important to a business.`, material.sections[0][1][0]]
        ]
      };
    }

      [5, 'Human Resource Management (HRM)', 'HRM ensures the right people are recruited, trained, motivated and managed effectively.', 'People in Business'],
      [6, 'Organisation and Management', 'Businesses organise their structure and leadership style to improve communication, efficiency and coordination.', 'People in Business'],
      [7, 'Methods of Communication', 'Communication helps managers and staff exchange information clearly and make decisions effectively.', 'People in Business'],
      [8, 'Motivating Employees', 'Motivation helps employees perform well and remain committed to the organisation.', 'People in Business'],

      [17, 'Production of Goods and Services', 'Production is the process of transforming resources into finished goods and services for sale.', 'Operations Management'],
      [18, 'Technology and Production of Goods and Services', 'Technology can improve productivity, quality and speed in production.', 'Operations Management'],
      [19, 'Sustainable Production of Goods and Services', 'Sustainability considers environmental and social impacts as businesses produce goods and services.', 'Operations Management'],
      [20, 'Costs, Scale of Production and Break-even Analysis', 'Businesses must understand cost behaviour and break-even to make pricing and output decisions.', 'Operations Management'],
      [21, 'Quality of Goods and Services', 'Quality affects customer satisfaction, reputation and repeat buying.', 'Operations Management'],
      [22, 'Location Decisions', 'Location influences costs, access to customers, labour availability and transport links.', 'Operations Management'],
      [23, 'Business Finance', 'Business finance supports operations, growth, investment and day-to-day cash needs.', 'Financial Information and Decisions'],

      [27, 'Analysis of Accounts', 'Businesses analyse accounts to assess performance, liquidity and profitability.', 'Financial Information and Decisions'],
      [28, 'Economic Issues', 'Economic issues include inflation, unemployment, taxation and changes in spending.', 'External Influences on Business Activity'],
      [29, 'Business and the International Economy', 'Global trade, exchange rates and international markets affect business performance and decisions.', 'External Influences on Business Activity'],
      [30, 'Business and the Environment', 'Businesses must manage environmental impact while staying competitive and legally compliant.', 'External Influences on Business Activity'],
      [31, 'Business and Ethical Issues, and Pressure Groups', 'Ethical behaviour and pressure groups influence business decisions and public perception.', 'External Influences on Business Activity']
    ];

    chapterSet.forEach(([num, title, summaryText, sectionLabel]) => {
      const template = makeChapterDataTemplate(num, title, summaryText, sectionLabel);
      addChapter(num, title, template.vocab, template.notes, template.mcq, template.exam);
    });

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('main-content').innerHTML = getHomeContent();
      const firstBtn = document.querySelector('.nav-item.special');
      if (firstBtn) firstBtn.classList.add('active');

      document.addEventListener('change', event => {
        const input = event.target;
        if (!input.matches('input[type="radio"]')) return;

        const question = input.closest('.mcq-question');
        question.querySelectorAll('.mcq-option').forEach(option => {
          option.classList.toggle('selected', option.contains(input));
        });
      });
    });
  </script>
